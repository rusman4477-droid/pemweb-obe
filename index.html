<!doctype html>
<html lang="id">
<head>
  <link rel="stylesheet" href="css/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Order</title>
  <meta name="description" content="Pesan makanan dan minuman langsung dari meja Anda tanpa perlu mengantre di kasir.">
</head>
<body>

  <header>
    <p>Tap Order</p>
    <p>Tarakan, Kalimantan Utara</p>
  </header>

  <main id="main-content">
    <section aria-labelledby="judul-sambutan">

      <img src="kasir-tersenyum.svg" alt="Ilustrasi kasir tersenyum ramah menyambut pelanggan">

      <h1 id="judul-sambutan">Selamat datang!</h1>
      <p>Pesan langsung dari meja Anda — tanpa perlu mengantre di kasir.</p>

      <hr>

      <form id="form-pesan" action="menu.html" method="get">

        <div>
          <label for="nama-pelanggan">Nama Anda</label>
          <input
            type="text"
            id="nama-pelanggan"
            name="nama"
            placeholder="masukkan nama anda"
            autocomplete="name"
            required
            aria-describedby="hint-nama">
          <!-- <span id="hint-nama">Dipakai agar pesanan mudah dikenali di dapur dan kasir.</span> -->
        </div>

        <div>
          <label for="nomor-meja">Nomor Meja</label>
          <input
            type="text"
            id="nomor-meja"
            name="meja"
            inputmode="numeric"
            placeholder="mis. 07"
            required
            aria-describedby="hint-meja">
          <!-- <span id="hint-meja">Terisi otomatis jika Anda membuka halaman ini lewat pindai kode QR di meja.</span> -->
        </div>

        <button type="submit">Mulai Pesan Sekarang</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Tap Order &middot; pemesanan mandiri berbasis kode QR</p>
  </footer>

</body>
</html>
